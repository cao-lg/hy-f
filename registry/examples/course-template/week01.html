<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: "Inter", sans-serif; }
      .preview-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #111; }
      .slide-frame { width: 1920px; height: 1080px; position: relative; transform-origin: center center; }
      .slide { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; opacity: 0; pointer-events: none; overflow: hidden; }
      .slide.active { opacity: 1; pointer-events: auto; }
      .slide-content-wrapper { position: relative; width: 100%; height: calc(100% - 170px); margin-top: 100px; padding: 0 80px 80px; overflow-y: auto; }
      .bg-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      .slide-header { position: absolute; top: 0; left: 0; right: 0; height: 100px; display: flex; align-items: center; padding: 0 80px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(20px); z-index: 10; }
      .week-badge { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; background: var(--accent, #3b82f6); border-radius: 8px; font-size: 18px; font-weight: 600; color: white; }
      .course-title { margin-left: 32px; font-size: 22px; font-weight: 500; color: rgba(255,255,255,0.7); }
      .slide-number { margin-left: auto; font-size: 18px; color: rgba(255,255,255,0.4); font-family: "IBM Plex Mono", monospace; }
      .slide-footer { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; display: flex; align-items: center; padding: 0 80px; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(20, 20, 20, 0.8); z-index: 10; }
      .progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
      .progress-fill { height: 100%; background: var(--accent, #3b82f6); transition: width 0.5s ease; }
      .footer-text { margin-left: 32px; font-size: 16px; color: rgba(255,255,255,0.5); }
      h1 { font-size: 120px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; background: linear-gradient(135deg,#fff 0%,#888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      h2 { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 48px; color: #fff; }
      .card { background: rgba(30, 30, 30, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px; backdrop-filter: blur(10px); }
      .badge { display: inline-flex; padding: 8px 16px; border-radius: 8px; font-size: 16px; font-weight: 600; }
      .badge-blue { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.4); }
      .badge-green { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.4); }
      .badge-purple { background: rgba(167, 139, 250, 0.2); color: #a78bfa; border: 1px solid rgba(167, 139, 250, 0.4); }
      ul { list-style: none; }
      ul li { position: relative; padding-left: 36px; margin-bottom: 20px; font-size: 26px; line-height: 1.5; color: rgba(255,255,255,0.8); }
      ul li::before { content: ""; position: absolute; left: 0; top: 10px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent, #3b82f6); }
      .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
      .highlight-text { font-size: 32px; font-weight: 600; color: #fff; line-height: 1.5; }
      .highlight-text span { color: #3b82f6; }
      .tag-list { display: flex; flex-wrap: wrap; gap: 16px; }
      .tag { padding: 12px 24px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; font-size: 20px; color: rgba(255,255,255,0.8); }
      .step-number { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #a78bfa); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: white; margin-bottom: 20px; }

      /* Exercise styles */
      .exercise-card { background: rgba(30,30,30,0.95); border: 2px solid rgba(59,130,246,0.4); border-radius: 20px; padding: 28px; transition: all 0.3s; }
      .exercise-card:hover { border-color: rgba(59,130,246,0.6); transform: translateY(-2px); }
      .exercise-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      .exercise-title { font-size: 22px; font-weight: 600; color: #fff; }
      .exercise-desc { font-size: 15px; color: rgba(255,255,255,0.7); line-height: 1.5; margin-bottom: 16px; }
      .exercise-hint { font-size: 13px; color: rgba(255,255,255,0.5); background: rgba(59,130,246,0.1); padding: 12px 16px; border-radius: 8px; margin-top: 12px; }
      .code-editor { width: 100%; background: #0d1117; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #c9d1d9; min-height: 120px; resize: vertical; line-height: 1.6; cursor: text; caret-color: #22c55e; }
      .code-editor:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
      .btn-run { background: linear-gradient(135deg, #22c55e, #16a34a); border: none; border-radius: 10px; padding: 12px 28px; font-size: 15px; font-weight: 600; color: white; cursor: pointer; transition: all 0.2s; }
      .btn-run:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(34,197,94,0.3); }
      .btn-run:disabled { background: #666; cursor: not-allowed; transform: none; }
      .output-area { background: #0d1117; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; margin-top: 16px; min-height: 50px; }
      .output-text { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #22c55e; white-space: pre-wrap; line-height: 1.6; }
      .output-error { color: #f97316; }
      .pyodide-status { font-size: 12px; color: rgba(255,255,255,0.5); margin-left: 12px; }
      .pyodide-ready { color: #22c55e; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="preview-container">
      <div id="subtitleArea" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:1000;max-width:80%;background:rgba(0,0,0,0.85);padding:16px 32px;border-radius:16px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);display:none;">
        <div id="subtitleText" style="color:#fff;font-size:20px;line-height:1.6;text-align:center;max-width:1200px;"></div>
      </div>
      <div id="navControls" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,0.8);padding:10px 20px;border-radius:50px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);">
        <button id="prevBtn" onclick="prevSlide()" style="width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all 0.2s;">‹</button>
        <button id="pauseBtn" onclick="togglePause()" style="width:40px;height:40px;border-radius:50%;border:none;background:#3b82f6;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;transition:all 0.2s;">❚❚</button>
        <button id="nextBtn" onclick="nextSlide()" style="width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all 0.2s;">›</button>
        <div style="width:1px;height:24px;background:rgba(255,255,255,0.2);margin:0 4px;"></div>
        <button id="subtitleBtn" onclick="toggleSubtitle()" style="width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.2s;">CC</button>
        <span id="slideCounter" style="color:rgba(255,255,255,0.7);font-size:13px;font-family:'IBM Plex Mono',monospace;min-width:50px;text-align:center;">1/11</span>
      </div>
      <div class="slide-frame" id="slideFrame"></div>
    </div>

    <script>
      // 课程配置数据
      const courseData = {
        exercises: [
          {
            id: "ex1",
            title: "print() 函数练习",
            difficulty: "基础",
            description: "在下方代码框输入代码，输出 Hello Python",
            codeTemplate: "",
            hints: ["print() 函数的括号里放要输出的内容", "文字要用引号包裹"]
          },
          {
            id: "ex2",
            title: "多行输出",
            difficulty: "基础",
            description: "输出3行内容：你的名字、年龄、爱好",
            codeTemplate: "",
            hints: ["每行内容用单独的 print()", "可以用变量存储后再输出"]
          },
          {
            id: "ex3",
            title: "变量使用",
            difficulty: "进阶",
            description: "定义变量 name 和 age，然后输出自我介绍",
            codeTemplate: "",
            hints: ["变量用 = 赋值", "字符串和数字拼接要用 str() 转类型"]
          }
        ],
        homework: [
          {
            id: "hw1",
            title: "个人信息卡片",
            required: true,
            description: "在下方编写代码，输出格式整齐的个人信息卡片",
            requirements: ["包含姓名、年龄、学校", "使用分隔线装饰", "格式整齐美观"],
            codeTemplate: "",
            testInputs: ["张三", "18", "清华大学", "计算机系"],
            hints: ["用 print('=' * 20) 画分隔线", "用 input() 获取用户输入", "用 f-string 格式化输出"]
          },
          {
            id: "hw2",
            title: "对话机器人",
            required: false,
            description: "编写程序依次询问3个问题，根据回答输出一段有趣的总结",
            features: ["input()", "字符串拼接", "f-string"],
            codeTemplate: "",
            testInputs: ["小明", "冰淇淋", "成为程序员"],
            hints: ["用 input() 获取用户输入", "用 f-string 拼接字符串"]
          }
        ]
      };

      // 幻灯片定义
      const slides = ['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11'];
      const durations = [6, 6, 8, 8, 8, 8, 8, 8, 6, 6, 10];
      let current = 0;
      let isPaused = false;
      let isSubtitleVisible = true;
      let elapsed = 0;
      let pyodide = null;
      let pyodideReady = false;
      let exerciseStates = {};

      // 初始化
      async function init() {
        renderAllSlides();
        initPyodide();
        setupKeyboardControls();
        setupResize();
        if(isSubtitleVisible) document.getElementById('subtitleArea').style.display = 'block';
        showSlide(0);
      }

      // 渲染所有幻灯片
      function renderAllSlides() {
        const frame = document.getElementById('slideFrame');
        frame.innerHTML = `
          ${renderSlide1()}
          ${renderSlide2()}
          ${renderSlide3()}
          ${renderSlide4()}
          ${renderSlide5()}
          ${renderSlide6()}
          ${renderSlide7()}
          ${renderSlide8()}
          ${renderSlide9()}
          ${renderSlide10()}
          ${renderSlide11()}
        `;
      }

      // 各幻灯片渲染函数
      function renderSlide1() {
        return `
          <div class="slide" id="s1" data-subtitle="欢迎来到Python编程基础课程！今天是第一周，我们将学习编程的基本概念和环境搭建。" style="opacity:1;">
            <div class="bg-gradient" style="background:radial-gradient(ellipse at 30% 20%, rgba(59,130,246,0.3) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(167,139,250,0.2) 0%, transparent 50%);"></div>
            <div style="position:absolute;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);background-size:80px 80px;"></div>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:100%;max-width:1400px;padding:0 60px;">
              <div style="margin-bottom:40px;"><span class="badge badge-blue" style="padding:16px 32px;font-size:22px;">第 1 周</span></div>
              <h1>编程初识<br>与环境搭建</h1>
              <p style="font-size:32px;color:rgba(255,255,255,0.6);margin-top:32px;">Python 编程基础系列课程</p>
              <div style="display:flex;align-items:center;justify-content:center;gap:48px;margin-top:56px;">
                <span style="display:flex;align-items:center;gap:12px;font-size:20px;color:rgba(255,255,255,0.5);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>4 课时</span>
                <span style="display:flex;align-items:center;gap:12px;font-size:20px;color:rgba(255,255,255,0.5);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path></svg>基础筑基</span>
              </div>
            </div>
          </div>
        `;
      }

      function renderSlide2() {
        return `
          <div class="slide" id="s2" data-subtitle="本节课有两个核心目标：知识目标是理解编程本质、掌握Python特点和环境搭建；能力目标是能独立安装Python环境并写出第一个程序。">
            <div class="slide-header" style="--accent:#3b82f6;"><span class="week-badge">第 1 周</span><span class="course-title">编程初识与环境搭建</span><span class="slide-number">02 / 11</span></div>
            <div class="slide-content-wrapper">

              <div class="grid-2">

                    <li>能独立完成Python开发环境的安装和配置</li>
                    <li>能编写并运行第一个Python程序</li>
                    <li>能使用print()函数在屏幕上输出信息</li>

                  </ul>

              </div>
            </div>
            <div class="slide-footer" style="--accent:#3b82f6;"><div class="progress-bar"><div class="progress-fill" style="width:17%"></div></div><span class="footer-text">课程进度</span></div>
          </div>
        `;
      }

      function renderSlide3() {
        return `
          <div class="slide" id="s3" data-subtitle="编程是什么？简单说，就是用计算机能听懂的语言，一步步告诉它该做什么。就像指挥一个特别听话但特别笨的机器人，你说什么它就做什么，但需要非常具体的指令。">
            <div class="slide-header" style="--accent:#3b82f6;"><span class="week-badge">第 1 周</span><span class="course-title">编程初识与环境搭建</span><span class="slide-number">03 / 11</span></div>
            <div class="slide-content-wrapper">
              <h2>什么是编程？</h2>

                    <div class="card" style="display:flex;align-items:center;gap:20px;padding:24px;"><span style="font-size:28px;">✓</span><span style="font-size:20px;color:rgba(255,255,255,0.9);">应用广泛，各行各业都在用</span></div>

        const area = document.getElementById('exercise-area-' + id);
        const isExpanded = exerciseStates[id];

        if (isExpanded) {
          // 收起 - 恢复按钮
          const ex = courseData.exercises.find(e => e.id === id) || courseData.homework.find(h => h.id === id);
          area.innerHTML = `<button class="btn-run" onclick="toggleExercise('${id}')" style="font-size:14px;padding:10px 24px;">${ex.difficulty ? '开始答题' : (ex.required === false ? '开始挑战' : '开始作答')}</button>`;
          exerciseStates[id] = false;
        } else {
          // 展开 - 显示编辑器
          const ex = courseData.exercises.find(e => e.id === id) || courseData.homework.find(h => h.id === id);
          area.innerHTML = `
            <textarea id="code-${id}" class="code-editor" style="min-height:140px;">${ex.codeTemplate || ''}</textarea>
            <div style="margin-top:12px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;">
              <button class="btn-run" onclick="runCode('${id}')">运行代码</button>
              <span id="pyodide-status-${id}" class="pyodide-status">${pyodideReady ? 'Python 就绪' : '加载中...'}</span>
            </div>
            <div id="output-${id}" class="output-area hidden">
              <div id="output-${id}-text" class="output-text"></div>
            </div>
            ${ex.hints ? `<div class="exercise-hint"><strong>提示：</strong>${ex.hints.join('；')}</div>` : ''}
          `;
          exerciseStates[id] = true;
        }
      }

      // 运行代码
      async function runCode(id) {
        const codeEl = document.getElementById('code-' + id);
        const outputEl = document.getElementById('output-' + id);
        const outputText = document.getElementById('output-' + id + '-text');

        if (!codeEl || !outputEl || !outputText) return;

        const code = codeEl.value;
        outputEl.classList.remove('hidden');
        outputText.textContent = '正在运行...';
        outputText.className = 'output-text';

        if (!pyodideReady) {
          outputText.textContent = 'Python 环境加载中，请稍候...';
          return;
        }

        try {
          // 获取练习的测试输入
          const ex = courseData.exercises.find(e => e.id === id) || courseData.homework.find(h => h.id === id);
          const testInputs = ex.testInputs || [];

          // 设置模拟输入
          let inputIndex = 0;
          pyodide.globals.set('_mock_inputs', testInputs.join('\n') + '\n');

          const wrappedCode = `
_mock_inputs = """${testInputs.join('\n')}"""
_mock_lines = _mock_inputs.split('\\n')
_mock_idx = 0

def _mock_input(prompt=''):
    global _mock_idx
    if _mock_idx < len(_mock_lines):
        result = _mock_lines[_mock_idx]
        _mock_idx += 1
        return result
    return ''

import builtins
builtins.input = _mock_input

${code}
`;

          let result = await pyodide.runPythonAsync(wrappedCode);
          outputText.textContent = result || '(程序执行完成)';
          outputText.className = 'output-text';
        } catch (e) {
          outputText.textContent = '错误: ' + e.message;
          outputText.className = 'output-text output-error';
        }
      }

      // 初始化 Pyodide
      async function initPyodide() {
        let retries = 3;
        while (retries > 0) {
          try {
            pyodide = await loadPyodide({
              indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
            });
            pyodideReady = true;
            document.querySelectorAll('[id^="pyodide-status-"]').forEach(el => {
              el.textContent = 'Python 就绪';
              el.classList.add('pyodide-ready');
            });
            return;
          } catch (e) {
            retries--;
            if (retries === 0) {
              document.querySelectorAll('[id^="pyodide-status-"]').forEach(el => {
                el.textContent = '加载失败';
                el.style.color = '#f97316';
              });
            } else {
              await new Promise(r => setTimeout(r, 2000));
            }
          }
        }
      }

      // 幻灯片导航
      function showSlide(idx) {
        document.querySelectorAll('.slide').forEach((el, i) => {
          el.style.opacity = i === idx ? '1' : '0';
          el.style.pointerEvents = i === idx ? 'auto' : 'none';
        });
        current = idx;
        document.getElementById('slideCounter').textContent = (idx + 1) + '/' + slides.length;

        const slideEl = document.getElementById(slides[idx]);
        const subtitleEl = document.getElementById('subtitleText');
        if (slideEl && subtitleEl) {
          subtitleEl.textContent = slideEl.getAttribute('data-subtitle') || '';
        }

        // 重置练习状态
        exerciseStates = {};
      }

      function prevSlide() {
        if (current > 0) showSlide(current - 1);
      }

      function nextSlide() {
        if (current < slides.length - 1) showSlide(current + 1);
      }

      function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById('pauseBtn');
        if (isPaused) {
          btn.textContent = '▶';
          btn.style.background = '#f97316';
        } else {
          btn.textContent = '❚❚';
          btn.style.background = '#3b82f6';
        }
      }

      function toggleSubtitle() {
        isSubtitleVisible = !isSubtitleVisible;
        const area = document.getElementById('subtitleArea');
        const btn = document.getElementById('subtitleBtn');
        if (area) area.style.display = isSubtitleVisible ? 'block' : 'none';
        if (btn) btn.style.background = isSubtitleVisible ? '#3b82f6' : 'rgba(255,255,255,0.1)';
      }

      function setupKeyboardControls() {
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); togglePause(); }
          if (e.key === 'c' || e.key === 'C') toggleSubtitle();
        });
      }

      function setupResize() {
        function resize() {
          const container = document.querySelector('.preview-container');
          const frame = document.getElementById('slideFrame');
          const scale = Math.min(container.clientWidth / 1920, container.clientHeight / 1080);
          frame.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resize);
        resize();
      }

      // 自动播放
      const totalDuration = durations.reduce((a, b) => a + b, 0);
      let elapsedTime = 0;

      setInterval(() => {
        if (isPaused) return;
        elapsedTime++;
        if (elapsedTime >= totalDuration) elapsedTime = 0;
      }, 1000);

      // 启动
      init();
    </script>
  </body>
</html>
