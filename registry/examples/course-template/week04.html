ccent};font-family:'IBM Plex Mono',monospace;">print()</code> 函数用于输出内容。</p></div></div></div></div><div class="slide-footer" style="--accent:${accent};"><div class="progress-bar"><div class="progress-fill" style="width:67%"></div></div><span class="footer-text">课程进度</span></div></div>`;

    function renderExerciseCard(ex) {
      return `<div class="exercise-card" id="card-${ex.id}"><div class="exercise-header"><span class="badge badge-${ex.difficulty === '基础' ? 'blue' : 'purple'}">${ex.difficulty}</span><span class="exercise-title">${ex.title}</span></div><p class="exercise-desc">${ex.description}</p><textarea id="code-${ex.id}" class="code-editor">${ex.codeTemplate || ''}</textarea><div style="margin-top:12px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;"><button class="btn-run" onclick="runCode('${ex.id}')">运行代码</button><span id="pyodide-status-${ex.id}" class="pyodide-status">Python 加载中...</span></div><div id="output-${ex.id}" class="output-area hidden"><div id="output-${ex.id}-text" class="output-text"></div></div>${ex.hints && ex.hints.length ? `<div class="exercise-hint"><strong>提示：</strong>${ex.hints.join('；')}</div>` : ''}</div>`;
    }

    function renderHomeworkCard(hw) {
      return `<div class="exercise-card" id="card-${hw.id}" style="border-color:${hw.required ? 'rgba(34,197,94,0.4)' : 'rgba(167,139,250,0.4)'};"><div class="exercise-header"><span class="badge ${hw.required ? 'badge-green' : 'badge-purple'}">${hw.required ? '必做' : '选做挑战'}</span><span class="exercise-title">${hw.title}</span></div><p class="exercise-desc">${hw.description}</p>${hw.requirements ? `<ul style="font-size:14px;color:rgba(255,255,255,0.6);margin:12px 0 12px 20px;">${hw.requirements.map(r => `<li style="margin:4px 0;">${r}</li>`).join('')}></ul>` : ''}${hw.features ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">${hw.features.map(f => `<span style="padding:6px 12px;background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);border-radius:6px;font-size:12px;color:#a78bfa;">${f}</span>`).join('')}</div>` : ''}<textarea id="code-${hw.id}" class="code-editor">${hw.codeTemplate || ''}</textarea><div style="margin-top:12px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;"><button class="btn-run" onclick="runCode('${hw.id}')">运行代码</button><span id="pyodide-status-${hw.id}" class="pyodide-status">Python 加载中...</span></div><div id="output-${hw.id}" class="output-area hidden"><div id="output-${hw.id}-text" class="output-text"></div></div>${hw.hints && hw.hints.length ? `<div class="exercise-hint"><strong>提示：</strong>${hw.hints.join('；')}</div>` : ''}</div>`;
    }

    function renderSlide9(week, accent) {
      return `<div class="slide" id="s9" data-subtitle="课堂练习"><div class="slide-header" style="--accent:${accent};"><span class="week-badge">第 ${week} 周</span><span class="slide-number">09 / 11</span></div><div class="slide-content-wrapper"><h2>课堂练习</h2><div class="grid-3">${courseData.exercises.map(ex => renderExerciseCard(ex)).join('')}</div></div><div class="slide-footer" style="--accent:${accent};"><div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div><span class="footer-text">课程进度</span></div></div>`;
    }

    function renderSlide10(week, accent) {
      return `<div class="slide" id="s10" data-subtitle="课后作业"><div class="slide-header" style="--accent:${accent};"><span class="week-badge">第 ${week} 周</span><span class="slide-number">10 / 11</span></div><div class="slide-content-wrapper"><h2>课后作业</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;">${courseData.homework.map(hw => renderHomeworkCard(hw)).join('')}</div></div><div class="slide-footer" style="--accent:${accent};"><div class="progress-bar"><div class="progress-fill" style="width:83%"></div></div><span class="footer-text">课程进度</span></div></div>`;
    }

    function renderSlide11(week, accent) {
      return `<div class="slide" id="s11" data-subtitle="项目任务"><div class="slide-header" style="--accent:${accent};"><span class="week-badge">第 ${week} 周</span><span class="slide-number">11 / 11</span></div><div class="slide-content-wrapper"><h2>项目任务</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;"><div><div style="display:flex;align-items:center;gap:24px;margin-bottom:32px;"><div style="width:88px;height:88px;border-radius:20px;background:linear-gradient(135deg,rgba(59,130,246,0.3),rgba(167,139,250,0.3));border:1px solid rgba(59,130,246,0.4);display:flex;align-items:center;justify-content:center;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="${accent}" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg></div><div><span style="font-size:14px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.05em;">项目名称</span><h3 style="font-size:36px;font-weight:700;margin:0;color:#fff;">综合项目</h3></div></div><p style="font-size:20px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:32px;">运用本节所学知识，完成一个综合项目。</p><div style="margin-bottom:28px;"><h4 style="font-size:14px;font-weight:600;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:16px;">功能需求</h4><ul><li style="display:flex;align-items:center;gap:16px;font-size:20px;margin-bottom:16px;"><span style="width:32px;height:32px;border-radius:50%;background:rgba(34,197,94,0.2);color:#22c55e;display:flex;align-items:center;justify-content:center;font-size:16px;">✓</span>需求一</li><li style="display:flex;align-items:center;gap:16px;font-size:20px;margin-bottom:16px;"><span style="width:32px;height:32px;border-radius:50%;background:rgba(34,197,94,0.2);color:#22c55e;display:flex;align-items:center;justify-content:center;font-size:16px;">✓</span>需求二</li><li style="display:flex;align-items:center;gap:16px;font-size:20px;"><span style="width:32px;height:32px;border-radius:50%;background:rgba(34,197,94,0.2);color:#22c55e;display:flex;align-items:center;justify-content:center;font-size:16px;">✓</span>需求三</li></ul></div></div><div class="card"><h4 style="font-size:18px;font-weight:600;color:#fff;margin-bottom:20px;">拓展挑战</h4><div style="display:flex;flex-direction:column;gap:12px;"><div style="padding:16px;background:rgba(249,115,22,0.15);border:1px solid rgba(249,115,22,0.3);border-radius:10px;"><span style="font-size:16px;color:#f97316;">拓展一</span><p style="font-size:13px;color:rgba(255,255,255,0.6);margin-top:8px;">拓展说明</p></div><div style="padding:16px;background:rgba(249,115,22,0.15);border:1px solid rgba(249,115,22,0.3);border-radius:10px;"><span style="font-size:16px;color:#f97316;">拓展二</span><p style="font-size:13px;color:rgba(255,255,255,0.6);margin-top:8px;">拓展说明</p></div></div></div></div></div><div class="slide-footer" style="--accent:#22c55e;background:linear-gradient(135deg,rgba(34,197,94,0.15),rgba(59,130,246,0.1));"><span style="font-size:16px;font-weight:600;color:#22c55e;margin-right:24px;">第 ${week} 周课程结束</span><div class="progress-bar"><div class="progress-fill" style="width:100%;background:#22c55e;"></div></div></div></div>`;
    }

    async function runCode(id) {
      const codeEl = document.getElementById('code-' + id);
      const outputEl = document.getElementById('output-' + id);
      const outputText = document.getElementById('output-' + id + '-text');
      if (!codeEl || !outputEl || !outputText) return;

      const code = codeEl.value;
      outputEl.classList.remove('hidden');
      outputText.textContent = '正在运行...';
      outputText.className = 'output-text';

      if (!pyodideReady) {
        outputText.textContent = 'Python 环境加载中，请稍候...';
        return;
      }

      try {
        const ex = courseData.exercises.find(e => e.id === id) || courseData.homework.find(h => h.id === id);
        const testInputs = ex.testInputs || [];
        const wrappedCode = `_mock_inputs = """${testInputs.join('
')}"""
_mock_lines = _mock_inputs.split('\n')
_mock_idx = 0
def _mock_input(prompt=''):
    global _mock_idx
    if _mock_idx < len(_mock_lines):
        result = _mock_lines[_mock_idx]
        _mock_idx += 1
        return result
    return ''
import builtins
builtins.input = _mock_input
${code}`;
        let result = await pyodide.runPythonAsync(wrappedCode);
        outputText.textContent = result || '(程序执行完成)';
        outputText.className = 'output-text';
      } catch (e) {
        outputText.textContent = '错误: ' + e.message;
        outputText.className = 'output-text output-error';
      }
    }

    async function initPyodide() {
      let retries = 3;
      while (retries > 0) {
        try {
          pyodide = await loadPyodide({
            indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
          });
          pyodideReady = true;
          document.querySelectorAll('[id^="pyodide-status-"]').forEach(el => {
            el.textContent = 'Python 就绪';
            el.classList.add('pyodide-ready');
          });
          return;
        } catch (e) {
          retries--;
          if (retries === 0) {
            document.querySelectorAll('[id^="pyodide-status-"]').forEach(el => {
              el.textContent = '加载失败';
              el.style.color = '#f97316';
            });
          } else {
            await new Promise(r => setTimeout(r, 2000));
          }
        }
      }
    }

    function showSlide(idx) {
      document.querySelectorAll('.slide').forEach((el, i) => {
        el.style.opacity = i === idx ? '1' : '0';
        el.style.pointerEvents = i === idx ? 'auto' : 'none';
      });
      current = idx;
      document.getElementById('slideCounter').textContent = (idx + 1) + '/' + slides.length;
      const slideEl = document.getElementById(slides[idx]);
      const subtitleEl = document.getElementById('subtitleText');
      if (slideEl && subtitleEl) {
        subtitleEl.textContent = slideEl.getAttribute('data-subtitle') || '';
      }
    }

    function prevSlide() { if (current > 0) showSlide(current - 1); }
    function nextSlide() { if (current < slides.length - 1) showSlide(current + 1); }

    function togglePause() {
      isPaused = !isPaused;
      const btn = document.getElementById('pauseBtn');
      btn.textContent = isPaused ? '▶' : '❚❚';
      btn.style.background = isPaused ? '#f97316' : '#f97316';
    }

    function toggleSubtitle() {
      isSubtitleVisible = !isSubtitleVisible;
      const area = document.getElementById('subtitleArea');
      const btn = document.getElementById('subtitleBtn');
      if (area) area.style.display = isSubtitleVisible ? 'block' : 'none';
      if (btn) btn.style.background = isSubtitleVisible ? '#f97316' : 'rgba(255,255,255,0.1)';
    }

    function setupKeyboardControls() {
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') prevSlide();
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === ' ') { e.preventDefault(); togglePause(); }
        if (e.key === 'c' || e.key === 'C') toggleSubtitle();
      });
    }

    function setupResize() {
      function resize() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.getElementById('slideFrame').style.transform = `scale(${scale})`;
      }
      window.addEventListener('resize', resize);
      resize();
    }

    init();
  </script>
